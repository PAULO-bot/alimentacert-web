let L=localStorage.getItem('ac_lang')||'es', current=[]; const $=id=>document.getElementById(id);
function setLang(l){L=l;localStorage.setItem('ac_lang',l);document.documentElement.lang=l;document.documentElement.dir=T[l].dir;render();}

function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');scrollTo(0,0)}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function startExam(){current=shuffle(QB[L]).slice(0,20).map(q=>{let a=shuffle(q.slice(1).map((v,i)=>({v,ok:i===0})));return{q:q[0],a,correct:a.findIndex(x=>x.ok)}});$('questions').innerHTML=current.map((x,i)=>`<div class="q"><b>${i+1}. ${x.q}</b>${x.a.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o.v}</label>`).join('')}</div>`).join('');$('result').innerHTML='';go('exam')}
function grade(){let score=0,missing=0;current.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(!a)missing++;else if(+a.value===x.correct)score++});if(missing){$('result').className='notice bad';$('result').textContent='⚠ '+missing;return}let pass=score>=16;let attempt={score,total:20,pass,lang:L,course:'food-handler',content_version:'2026.09',at:new Date().toISOString()};localStorage.setItem('ac_attempt',JSON.stringify(attempt));if(pass){$('result').className='notice ok';$('result').innerHTML=`<b>${T[L].pass} · ${score}/20</b><br><button class="btn" onclick="go('identity')">${T[L].continue}</button>`}else{$('result').className='notice bad';$('result').innerHTML=`<b>${T[L].fail} · ${score}/20</b><br><button class="btn" onclick="startExam()">${T[L].retry}</button>`}}
function saveIdentity(){let data={name:$('fullName').value.trim(),document:$('document').value.trim(),email:$('email').value.trim(),country:$('country').value};if(!data.name||!data.document||!/^[^@]+@[^@]+\.[^@]+$/.test(data.email)){alert('Revisa los datos / Check your details');return}localStorage.setItem('ac_identity',JSON.stringify(data));go('payment')}
async function checkout(){let cfg=window.ALIMENTACERT_CONFIG||{};if(!cfg.checkoutEndpoint){alert('Stripe TEST pendiente de configurar. El paquete incluye la función segura create-checkout.');return}let attempt=JSON.parse(localStorage.getItem('ac_attempt')||'{}'),identity=JSON.parse(localStorage.getItem('ac_identity')||'{}');if(!attempt.pass){alert('Exam required');return}let r=await fetch(cfg.checkoutEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attempt,identity,lang:L})});let d=await r.json();if(d.url)location.href=d.url;else alert(d.error||'Checkout error')}

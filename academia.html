 "Garantía de esterilidad", "Sustitución del control de temperaturas"]], ["¿Qué describe mejor la desinfección?", ["Reducción de microorganismos mediante un procedimiento adecuado", "Eliminar únicamente restos visibles", "Enfriar un alimento"]], ["¿Qué debe hacerse con una herida en la mano?", ["Protegerla adecuadamente y usar la protección requerida", "Dejarla descubierta", "Lavarla una vez y seguir sin protección"]], ["¿Para qué sirve la trazabilidad?", ["Para conocer origen, lote y destino y actuar ante incidencias", "Para decorar el etiquetado", "Para evitar registrar proveedores"]], ["¿Cuál es un peligro físico?", ["Un fragmento de vidrio", "Salmonella", "Un residuo de detergente"]], ["¿Cuál es un peligro químico?", ["Un residuo de producto de limpieza", "Una piedra", "Una bacteria"]], ["¿Cuál es un peligro biológico?", ["Una bacteria patógena", "Una grapa", "Un detergente"]], ["¿Qué debe hacerse con alimentos crudos y cocinados?", ["Mantenerlos separados para evitar contaminación cruzada", "Mezclarlos durante el almacenamiento", "Usar siempre el mismo utensilio sin lavar"]], ["¿Qué es importante al usar un desinfectante?", ["Respetar concentración y tiempo de contacto indicados", "Usar siempre la mayor cantidad posible", "Mezclarlo con otros productos sin comprobar compatibilidad"]], ["¿Qué debe comprobarse en una recepción de alimentos?", ["Condiciones del producto y, cuando corresponda, temperatura", "Solo el precio", "Solo el color del vehículo"]], ["¿Qué práctica es correcta en una cámara frigorífica?", ["Evitar que productos crudos contaminen alimentos listos para consumo", "Colocar crudos encima de listos para consumo", "Dejar envases abiertos sin control"]], ["¿Qué debe hacerse ante una posible incidencia alimentaria?", ["Seguir el procedimiento y conservar registros y trazabilidad", "Borrar los registros", "Improvisar sin comunicarla"]], ["¿Qué ayuda al control de plagas?", ["Orden, limpieza, cierre de accesos y vigilancia", "Dejar residuos accesibles" ."], ["8. Good practices", "Use procedures, records, pest control and a positive food-safety culture."]], "questions": [["When should a food handler wash their hands?", ["Before starting work and whenever they may have become contaminated", "Only at the end of the shift", "Only when visibly dirty"]], ["What helps prevent cross-contamination?", ["Separating raw food from ready-to-eat food", "Using the same board without cleaning it", "Storing raw meat above ready-to-eat food"]], ["What best describes cleaning?", ["Removing dirt and residues", "Guaranteeing sterility", "Replacing temperature control"]], ["What best describes disinfection?", ["Reducing microorganisms through an appropriate procedure", "Removing only visible residues", "Cooling food"]], ["What should be done with a hand wound?", ["Protect it properly and use the required protection", "Leave it uncovered", "Wash it once and continue unprotected"]], ["What is traceability for?", ["Knowing origin, batch and destination so action can be taken during incidents", "Decorating labels", "Avoiding supplier records"]], ["Which is a physical hazard?", ["A piece of glass", "Salmonella", "Detergent residue"]], ["Which is a chemical hazard?", ["Cleaning-product residue", "A stone", "A bacterium"]], ["Which is a biological hazard?", ["A pathogenic bacterium", "A staple", "A detergent"]], ["What should be done with raw and cooked foods?", ["Keep them separate to prevent cross-contamination", "Mix them during storage", "Always use the same unwashed utensil"]], ["What matters when using a disinfectant?", ["Following the stated concentration and contact time", "Always using as much as possible", "Mixing it with other products without checking compatibility"]], ["What should be checked when receiving food?", ["Product condition and, where relevant, temperature", "Only price", "Only vehicle colour"]], ["What is correct in cold storage?", ["Prevent raw foods contaminating ready-to-eat foods", "Place raw foods above ready-to-eat foods", "Leave packages open without control"]], ["What should be done during a possible food-safety incident?", ["Follow the procedure and preserve records and traceability", "Delete the records", "Improvise without reporting it"]], ["What helps pest control?", ["Order, cleaning, closing access points and monitoring", "Leaving waste accessible", "Keeping doors open unnecessarily"]], ["What should happen to utensils between incompatible uses?", ["They should be cleaned and, where appropriate, disinfected", "They need no treatment", "They only need drying"]], ["What allergen information should be provided?", ["Reliable information based on the actual composition", "An approximate answer", "A guarantee without checking"]], ["What is a good food-safety culture?", ["Staff consistently understand and apply safe practices", "Relying only on an annual inspection", "Avoiding communication of errors"]], ["What if safe storage of a food cannot be guaranteed?", ["Apply the safety procedure and assess disposal", "Always serve it", "Mix it with new food"]], ["What is the main aim of food-handler training?", ["To work hygienically and reduce consumer risk", "To replace all establishment controls", "To avoid all records"]]]}, "ru": {"title": "Обращение с пищевыми продуктами", "subtitle": "8 модулей · гигиена, загрязнение, хранение, уборка, прослеживаемость и безопасная работа", "modules": [["1. Личная гигиена", "Правильное мытьё рук, чистая рабочая одежда, защита ран и привычки, предотвращающие загрязнение пищи."], ["2. Пищевые опасности", "Различайте биологические, химические и физические опасности и способы их предотвращения."], ["3. Перекрёстное загрязнение", "Разделяйте сырые и готовые продукты, используйте чистые инструменты и правильно организуйте хранение."], ["4. Безопасные температуры", "Контролируйте приёмку, хранение, приготовление, охлаждение и разогрев по установленным процедурам."], ["5. Очистка и дезинфекция", "Очистка удаляет грязь, дезинфекция снижает количество микроорганизмов. Важны правильный порядок и дозировка."], ["6. Прослеживаемость", "Записи о поставщиках, партиях и получателях помогают быстро действовать при инцидентах и отзыве продукции."], ["7. Аллергены", "Предотвращайте перекрёстный контакт и предоставляйте достоверную информацию о составе и аллергенах."], ["8. Надлежащая практика", "Используйте процедуры, записи, контроль вредителей и культуру безопасности пищевых продуктов."]], "questions": [["Когда работник с пищей должен мыть руки?", ["Перед началом работы и каждый раз после возможного загрязнения", "Только в конце смены", "Только если грязь видна"]], ["Что помогает предотвратить перекрёстное загрязнение?", ["Разделение сырых и готовых к употреблению продуктов", "Одна доска без очистки", "Хранение сырого мяса над готовыми продуктами"]], ["Что лучше всего описывает очистку?", ["Удаление грязи и остатков", "Гарантия стерильности", "Замена температурного контроля"]], ["Что лучше всего описывает дезинфекцию?", ["Снижение количества микроорганизмов подходящим методом", "Удаление только видимых остатков", "Охлаждение пищи"]], ["Что делать с раной на руке?", ["Надёжно закрыть её и использовать требуемую защиту", "Оставить открытой", "Один раз промыть и работать без защиты"]], ["Для чего нужна прослеживаемость?", ["Чтобы знать происхождение, партию и получателя и действовать при инцидентах", "Для украшения этикетки", "Чтобы не вести записи о поставщиках"]], ["Что является физической опасностью?", ["Осколок стекла", "Сальмонелла", "Остаток моющего средства"]], ["Что является химической опасностью?", ["Остаток чистящего средства", "Камень", "Бактерия"]], ["Что является биологической опасностью?", ["Патогенная бактерия", "Скоба", "Моющее средство"]], ["Как обращаться с сырыми и готовыми продуктами?", ["Хранить раздельно для предотвращения перекрёстного загрязнения", "Смешивать при хранении", "Всегда использовать один немытый инструмент"]], ["Что важно при использовании дезинфицирующего средства?", ["Соблюдать указанную концентрацию и время контакта", "Всегда использовать максимально возможное количество", "Смешивать с другими средствами без проверки совместимости"]], ["Что проверяют при приёмке продуктов?", ["Состояние продукта и, при необходимости, температуру", "Только цену", "Только цвет автомобиля"]], ["Как правильно хранить продукты в холодильной камере?", ["Не допускать загрязнения готовых продуктов сырыми", "Класть сырые продукты над готовыми", "Оставлять упаковки открытыми без контроля"]], ["Что делать при возможном инциденте безопасности пищевых продуктов?", ["Следовать процедуре и сохранять записи и прослеживаемость", "Удалить записи", "Импровизировать и никому не сообщать"]], ["Что помогает контролю вредителей?", ["Порядок, уборка, закрытие доступов и наблюдение", "Доступные отходы", "Ненужные открытые двери"]], ["Что делать с инвентарём между несовместимыми использованиями?", ["Очищать и при необходимости дезинфицировать", "Ничего", "Только сушить"]], ["Какую информацию об аллергенах нужно давать?", ["Достоверную информацию на основе фактического состава", "Приблизительный ответ", "Гарантию без проверки"]], ["Что такое хорошая культура безопасности пищевых продуктов?", ["Персонал постоянно понимает и применяет безопасные практики", "Полагаться только на ежегодную инспекцию", "Не сообщать об ошибках"]], ["Что делать, если безопасное хранение продукта нельзя подтвердить?", ["Применить процедуру безопасности и оценить необходимость утилизации", "Всегда подать продукт", "Смешать с новым продуктом"]], ["Главная цель обучения работника с пищей?", ["Работать гигиенично и снижать риск для потребителя", "Заменить все меры контроля", "Отказаться от всех записей"]]]}, "ar": {"title": "تداول الأغذية", "subtitle": "8 وحدات · النظافة والتلوث والحفظ والتنظيف والتتبع والممارسات الجيدة", "modules": [["1. النظافة الشخصية", "غسل اليدين بصورة صحيحة، وارتداء ملابس عمل نظيفة، وتغطية الجروح وتجنب العادات التي قد تلوث الطعام."], ["2. مخاطر الأغذية", "التعرف على المخاطر البيولوجية والكيميائية والفيزيائية وطرق الوقاية منها."], ["3. التلوث المتبادل", "فصل الأغذية النيئة عن المطهية، واستخدام أدوات نظيفة وتنظيم الأسطح والتخزين البارد بصورة صحيحة."], ["4. درجات الحرارة الآمنة", "مراقبة الاستلام والحفظ والطهي والتبريد وإعادة التسخين وفق إجراءات محددة."], ["5. التنظيف والتطهير", "التنظيف يزيل الأوساخ، والتطهير يقلل الكائنات الدقيقة. يجب استخدام الترتيب والجرعة الصحيحين."], ["6. التتبع", "تسجيل الموردين والدفعات والوجهات يساعد على التصرف السريع عند الحوادث أو سحب المنتجات."], ["7. مسببات الحساسية", "منع التلامس التبادلي وتقديم معلومات موثوقة عن المكونات ومسببات الحساسية."], ["8. الممارسات الجيدة", "اتباع الإجراءات والسجلات ومكافحة الآفات وتعزيز ثقافة سلامة الغذاء."]], "questions": [["متى يجب على متداول الأغذية غسل يديه؟", ["قبل بدء العمل وكلما كان من المحتمل أن تتلوث اليدان", "فقط في نهاية الوردية", "فقط عندما تكون الأوساخ ظاهرة"]], ["ما الذي يساعد على منع التلوث المتبادل؟", ["فصل الأغذية النيئة عن الجاهزة للأكل", "استخدام لوح التقطيع نفسه دون تنظيف", "وضع اللحوم النيئة فوق الأغذية الجاهزة"]], ["ما الوصف الأفضل للتنظيف؟", ["إزالة الأوساخ والبقايا", "ضمان التعقيم الكامل", "استبدال التحكم في الحرارة"]], ["ما الوصف الأفضل للتطهير؟", ["خفض الكائنات الدقيقة بإجراء مناسب", "إزالة البقايا الظاهرة فقط", "تبريد الطعام"]], ["ماذا يجب فعل الجرح في اليد؟", ["تغطيته جيدًا واستخدام الحماية المطلوبة", "تركه مكشوفًا", "غسله مرة واحدة والعمل دون حماية"]], ["ما فائدة التتبع؟", ["معرفة المصدر والدفعة والوجهة والتصرف عند الحوادث", "تزيين الملصق", "تجنب تسجيل الموردين"]], ["أي مما يلي خطر فيزيائي؟", ["قطعة زجاج", "السالمونيلا", "بقايا منظف"]], ["أي مما يلي خطر كيميائي؟", ["بقايا مادة تنظيف", "حجر", "بكتيريا"]], ["أي مما يلي خطر بيولوجي؟", ["بكتيريا ممرضة", "دبوس معدني", "منظف"]], ["كيف يجب التعامل مع الأغذية النيئة والمطبوخة؟", ["إبقاؤها منفصلة لمنع التلوث المتبادل", "خلطها أثناء التخزين", "استخدام الأداة نفسها دون غسل"]], ["ما المهم عند استخدام مطهر؟", ["اتباع التركيز ووقت التلامس المحددين", "استخدام أكبر كمية ممكنة دائمًا", "خلطه بمواد أخرى دون التحقق من التوافق"]], ["ما الذي tención debe evitar suposiciones y respuestas improvisadas."], ["6. Limpieza específica", "La limpieza debe ser eficaz para retirar residuos alergénicos; no basta con apartar visualmente el alimento."], ["7. Gestión de incidencias", "Ante una duda, no se debe garantizar ausencia de alérgenos sin información verificable."]], "questions": [["¿Qué caracteriza a una alergia alimentaria?", ["Puede implicar una respuesta del sistema inmunitario", "Es siempre una preferencia personal", "Se elimina cocinando cualquier alimento"]], ["¿Cuántos grupos principales de alérgenos contempla el listado europeo de declaración obligatoria?", ["14", "7", "20"]], ["¿Qué es el contacto cruzado con alérgenos?", ["Transferencia involuntaria de un alérgeno a otro alimento", "Cambio del nombre de un plato", "Enfriamiento del alimento"]], ["¿Puede una misma freidora transferir alérgenos?", ["Sí, el aceite compartido puede ser una vía de contacto cruzado", "No, nunca", "Solo si el aceite está frío"]], ["¿Qué debe hacerse si un cliente pregunta por un alérgeno y no se conoce la respuesta?", ["Comprobar información fiable antes de responder", "Adivinar", "Decir que no contiene alérgenos sin verificar"]], ["¿Debe coincidir la información de alérgenos con la receta real?", ["Sí", "No", "Solo en alimentos envasados"]], ["¿Qué puede transferir alérgenos?", ["Utensilios, manos y superficies", "Solo el aire exterior", "Únicamente el envase original"]], ["¿Es suficiente retirar a simple vista un ingrediente alergénico de un plato?", ["No, puede permanecer contaminación por contacto", "Sí, siempre", "Solo si el plato está caliente"]], ["¿Qué papel tiene la limpieza?", ["Ayudar a eliminar residuos alergénicos según un procedimiento eficaz", "Garantizar siempre ausencia absoluta sin verificación", "Sustituir la información al consumidor"]], ["¿Debe el personal de sala comunicar con cocina las consultas sobre alérgenos?", ["Sí, mediante un sistema fiable", "No es necesario", "Solo al final del servicio"]], ["¿Qué debe evitarse al responder a una persona alérgica?", ["Improvisar o prometer ausencia sin comprobar", "Consultar fichas de producto", "Revisar la receta"]], ["¿Los cambios de proveedor pueden afectar la información de alérgenos?", ["Sí", "No", "Nunca si el nombre del producto es igual"]], ["¿Qué documento puede ayudar a gestionar alérgenos?", ["Una ficha actualizada de ingredientes y alérgenos", "Una lista de precios sin ingredientes", "Un calendario de turnos"]], ["¿La leche y los frutos de cáscara forman parte de los 14 grupos principales?", ["Sí", "No", "Solo la leche"]], ["¿El gluten se gestiona mediante cereales que contienen gluten en el listado?", ["Sí", "No", "Solo en bebidas"]], ["¿Qué debe hacerse con utensilios destinados a preparaciones especiales?", ["Gestionarlos para evitar contacto cruzado y mantenerlos limpios", "Compartirlos sin control", "Guardarlos sucios"]], ["¿Puede una salsa cambiar el perfil de alérgenos de un plato?", ["Sí", "No", "Solo si cambia el color"]], ["¿Quién debe conocer el procedimiento de alérgenos?", ["El personal implicado en preparación y servicio", "Solo el propietario", "Solo los clientes"]], ["¿Qué debe hacerse si cambia una receta?", ["Actualizar la información de alérgenos", "Mantener la información antigua", "Eliminar todos los registros"]], ["¿Cuál es la respuesta más segura ante una duda no resoluble?", ["No asegurar ausencia del alérgeno y explicar la limitación", "Decir que es seguro sin comprobar", "Ignorar la pregunta"]]]}, "en": {"title": "Allergens & Intolerances", "subtitle": "7 modules · 14 allergens, cross-contact and consumer information", "modules": [["1. Allergy vs intolerance", "Food allergy involves an immune response; intolerance has different mechanisms and still requires reliable information."], ["2. The 14 allergens", "EU rules require declaration of 14 main allergen groups when present under the applicable conditions."], ["3. Labelling and information", "Allergen information must be clear, accessible and consistent with the actual recipe."], ["4. Cross-contact", "Utensils, hands, oil, surfaces and storage can transfer allergens."], ["5. Kitchen and service", "Kitchen and front-of-house communication must avoid assumptions and improvised answers."], ["6. Specific cleaning", "Cleaning must effectively remove allergen residues; simply moving visible food away is not enough."], ["7. Incident management", "When uncertain, never guarantee that a food is allergen-free without verifiable information."]], "questions": [["What characterises a food allergy?", ["It may involve an immune-system response", "It is always a personal preference", "Cooking always removes it"]], ["How many main allergen groups are in the EU mandatory declaration list?", ["14", "7", "20"]], ["What is allergen cross-contact?", ["Unintentional transfer of an allergen to another food", "Changing the name of a dish", "Cooling food"]], ["Can a shared fryer transfer allergens?", ["Yes, shared oil can cause cross-contact", "No, never", "Only when the oil is cold"]], ["What if a customer asks about an allergen and the answer is unknown?", ["Check reliable information before answering", "Guess", "Say it is allergen-free without checking"]], ["Should allergen information match the actual recipe?", ["Yes", "No", "Only for packaged foods"]], ["What can transfer allergens?", ["Utensils, hands and surfaces", "Only outdoor air", "Only original packaging"]], ["Is visibly removing an allergenic ingredient enough?", ["No, cross-contact may remain", "Yes, always", "Only if the dish is hot"]], ["What is the role of cleaning?", ["Help remove allergen residues with an effective procedure", "Always guarantee absolute absence without verification", "Replace consumer information"]], ["Should service staff communicate allergen questions with the kitchen?", ["Yes, through a reliable system", "No", "Only at the end of service"]], ["What should be avoided when answering an allergic customer?", ["Improvising or promising absence without checking", "Checking product sheets", "Reviewing the recipe"]], ["Can supplier changes affect allergen information?", ["Yes", "No", "Never if the product name is unchanged"]], ["What can help manage allergens?", ["An updated ingredient and allergen sheet", "A price list without ingredients", "A staff rota"]], ["Are milk and tree nuts among the 14 main groups?", ["Yes", "No", "Only milk"]], ["Is gluten managed through cereals containing gluten in the list?", ["Yes", "No", "Only in drinks"]], ["How should utensils for special preparations be managed?", ["To prevent cross-contact and keep them clean", "Share them without control", "Store them dirty"]], ["Can a sauce change a dish allergen profile?", ["Yes", "No", "Only if colour changes"]], ["Who should know the allergen procedure?", ["Staff involved in preparation and service", "Only the owner", "Only customers"]], ["What should happen when a recipe changes?", ["Update allergen information", "Keep old information", "Delete all records"]], ["What is safest when uncertainty cannot be resolved?", ["Do not guarantee absence and explain the limitation", "Say it is safe without checking", "Ignore the question"]]]}, "ru": {"title": "Аллергены и непереносимость", "subtitle": "7 модулей · 14 аллергенов, перекрёстное загрязнение и информация для потребителя", "modules": [["1. Аллергия и непереносимость", "Пищевая аллергия связана с иммунной реакцией; непереносимость имеет иной механизм, но также требует достоверной информации."], ["2. 14 аллергенов", "Правила ЕС требуют указывать 14 основных групп аллергенов при их наличии в применимых случаях."], ["3. Маркировка и информация", "Информация об аллергенах должна быть ясной, доступной и соответствовать фактическому рецепту."], ["4. Перекрёстный контакт", "Инструменты, руки, масло, поверхности и хранение могут переносить аллергены."], ["5. Кухня и обслуживание", "Связь между кухней и персоналом зала должна исключать догадки и импровизированные ответы."], ["6. Специальная очистка", "Очистка должна эффективно удалять остатки аллергенов; просто убрать видимый продукт недостаточно."], ["7. Управление инцидентами", "При сомнениях нельзя гарантировать отсутствие аллергена без проверяемой информации."]], "questions": [["Что характерно для пищевой аллергии?", ["Она может включать реакцию иммунной системы", "Это всегда личное предпочтение", "Любая тепловая обработка её устраняет"]], ["Сколько основных групп аллергенов включает обязательный перечень ЕС?", ["14", "7", "20"]], ["Что такое перекрёстный контакт с аллергеном?", ["Непреднамеренный перенос аллергена в другой продукт", "Изменение названия блюда", "Охлаждение продукта"]], ["Может ли общая фритюрница переносить аллергены?", ["Да, общее масло может стать путём перекрёстного контакта", "Нет, никогда", "Только если масло холодное"]], ["Что делать, если клиент спрашивает об аллергене, а ответа нет?", ["Проверить достоверную информацию перед ответом", "Угадать", "Сказать, что аллергенов нет, без проверки"]], ["Должна ли информация об аллергенах соответствовать фактическому рецепту?", ["Да", "Нет", "Только для упакованных продуктов"]], ["Что может переносить аллергены?", ["Инструменты, руки и поверхности", "Только наружный воздух", "Только исходная упаковка"]], ["Достаточно ли просто убрать видимый аллергенный ингредиент?", ["Нет, перекрёстный контакт может сохраниться", "Да, всегда", "Только если блюдо горячее"]], ["Какова роль очистки?", ["Помогать удалять остатки аллергенов эффективной процедурой", "Всегда гарантировать абсолютное отсутствие без проверки", "Заменять информацию потребителю"]], ["Должен ли персонал зала согласовывать вопросы об аллергенах с кухней?", ["Да, через надёжную систему", "Нет", "Только после обслуживания"]], ["Чего следует избегать при ответе человеку с аллергией?", ["Импровизации и обещаний без проверки", "Проверки документации продукта", "Проверки рецепта"]], ["Может ли смена поставщика изменить информацию об аллергенах?", ["Да", "Нет", "Никогда, если название продукта не изменилось"]], ["Что помогает управлять аллергенами?", ["Актуальная карта ингредиентов и аллергенов", "Прайс-лист без состава", "График смен"]], ["Молоко и орехи входят в 14 основных групп?", ["Да", "Нет", "Только молоко"]], ["Управляется ли глютен через злаки, содержащие глютен?", ["Да", "Нет", "Только в напитках"]], ["Как обращаться с инвентарём для специальных блюд?", ["Предотвращать перекрёстный контакт и содержать его в чистоте", "Использовать совместно без контроля", "Хранить грязным"]], ["Может ли соус изменить профиль аллергенов блюда?", ["Да", "Нет", "Только если меняется цвет"]], ["Кто должен знать процедуру по аллергенам?", ["Персонал, участвующий в приготовлении и обслуживании", "Только владелец", "Только клиенты"]], ["Что делать при изменении рецепта?", ["Обновить информацию об аллергенах", "Оставить старую информацию", "Удалить все записи"]], ["Как безопаснее ответить при неустранимой неопределённости?", ["Не гарантировать отсутствие аллергена и объяснить ограничение", "Сказать, что всё безопасно без проверки", "Игнорировать вопрос"]]]}, "ar": {"title": "مسببات الحساسية وعدم التحمل", "subtitle": "7 وحدات · 14 مسببًا للحساسية والتلوث التبادلي ومعلومات المستهلك", "modules": [["1. الحساسية وعدم التحمل", "الحساسية الغذائية تتضمن استجابة مناعية، بينما يختلف عدم التحمل في آليته، وكلاهما يحتاج إلى معلومات موثوقة."], ["2. مسببات الحساسية الأربعة عشر", "تتطلب قواعد الاتحاد الأوروبي الإفصاح عن 14 مجموعة رئيسية من مسببات الحساسية عند وجودها وفق الشروط المطبقة."], ["3. الوسم والمعلومات", "يجب أن تكون معلومات مسببات الحساسية واضحة ومتاحة ومتوافقة مع الوصفة الفعلية."], ["4. التلامس التبادلي", "يمكن للأدوات واليدين والزيوت والأسطح والتخزين نقل مسببات الحساسية."], ["5. المطبخ والخدمة", "يجب أن يمنع التواصل بين المطبخ وطاقم الخدمة التخمين والإجابات غير الموثوقة."], ["6. التنظيف الخاص", "يجب أن يزيل التنظيف بقايا مسببات الحساسية بفعالية؛ إبعاد الطعام الظاهر وحده لا يكفي."], ["7. إدارة الحوادث", "عند الشك، لا يجوز ضمان خلو الطعام من مسببات الحساسية دون معلومات قابلة للتحقق."]], "questions": [["ما الذي يميز الحساسية الغذائية؟", ["قد تتضمن استجابة من جهاز المناعة", "هي دائمًا تفضيل شخصي", "يُزيلها الطهي دائمًا"]], ["كم عدد المجموعات الرئيسية لمسببات الحساسية في قائمة الاتحاد الأوروبي؟", ["14", "7", "20"]], ["ما هو التلامس التبادلي لمسببات الحساسية؟", ["انتقال غير مقصود لمسبب حساسية إلى طعام آخر", "تغيير اسم الطبق", "تبريد الطعام"]], ["هل يمكن للقلاية المشتركة نقل مسببات الحساسية؟", ["نعم، قد يكون الزيت المشترك طريقًا للتلامس التبادلي", "لا، أبدًا", "فقط إذا كان الزيت باردًا"]], ["ماذا نفعل إذا سأل العميل عن مسبب حساسية ولم نعرف الإجابة؟", ["التحقق من معلومات موثوقة قبل الرد", "التخمين", "القول إنه خالٍ من مسببات الحساسية دون تحقق"]], ["هل يجب أن تتوافق معلومات مسببات الحساسية مع الوصفة الفعلية؟", ["نعم", "لا", "فقط للأغذية المعبأة"]], ["ما الذي يمكنه نقل مسببات الحساسية؟", ["الأدوات واليدين والأسطح", "الهواء الخارجي فقط", "العبوة الأصلية فقط"]], ["هل تكفي إزالة المكون المسبب للحساسية بالعين؟", ["لا، قد يبقى تلامس تبادلي", "نعم دائمًا", "فقط إذا كان الطبق ساخنًا"]], ["ما دور التنظيف؟", ["المساعدة على إزالة بقايا مسببات الحساسية بإجراء فعال", "ضمان الغياب المطلق دائمًا دون تحقق", "استبدال معلومات المستهلك"]], ["هل يجب على طاقم الخدمة التواصل مع المطبخ حول مسببات الحساسية؟", ["نعم، عبر نظام موثوق", "لا", "فقط في نهاية الخدمة"]], ["ما الذي يجب تجنبه عند الرد على شخص لديه حساسية؟", ["الارتجال أو ضمان الغياب دون تحقق", "فحص بطاقات المنتجات", "مراجعة الوصفة"]], ["هل يمكن لتغيير المورد أن يغير معلومات مسببات الحساسية؟", ["نعم", "لا", "أبدًا إذا بقي اسم المنتج نفسه"]], ["ما الذي يساعد على إدارة مسببات الحساسية؟", ["بطاقة محدثة للمكونات ومسببات الحساسية", "قائمة أسعار دون مكونات", "جدول الورديات"]], ["هل الحليب والمكسرات من المجموعات الـ14 الرئيسية؟", ["نعم", "لا", "الحليب فقط"]], ["هل يُدار الغلوتين من خلال الحبوب التي تحتوي عليه في القائمة؟", ["نعم", "لا", "فقط في المشروبات"]], ["كيف تُدار أدوات التحضير الخاصة؟", ["لمنع التلامس التبادلي والحفاظ على نظافتها", "مشاركتها بلا رقابة", "تخزينها متسخة"]], ["هل يمكن للصلصة تغيير ملف مسببات الحساسية للطبق؟", ["نعم", "لا", "فقط إذا تغير اللون"]], ["من يجب أن يعرف إجراء مسببات الحساسية؟", ["العاملون في التحضير والخدمة", "المالك فقط", "العملاء فقط"]], ["ماذا نفعل عند تغيير الوصفة؟", ["تحديث معلومات مسببات الحساسية", "الإبقاء على المعلومات القديمة", "حذف كل السجلات"]], ["ما التصرف الأكثر أمانًا إذا تعذر حل الشك؟", ["عدم ضمان غياب المسبب وشرح القيد", "القول إنه آمن دون تحقق", "تجاهل السؤال"]]]}}, "appcc": {"es": {"title": "APPCC Básico", "subtitle": "8 módulos · peligros, puntos de control, vigilancia, registros y acciones correctoras", "modules": [["1. Qué es APPCC", "Sistema preventivo para identificar peligros significativos y establecer medidas de control."], ["2. Prerrequisitos", "Higiene, limpieza, agua, proveedores, plagas y mantenimiento sostienen el sistema APPCC."], ["3. Análisis de peligros", "Se valora qué puede ocurrir, su gravedad y la probabilidad para decidir controles adecuados."], ["4. Puntos de control crítico", "Un PCC es una etapa donde el control es esencial para prevenir, eliminar o reducir un peligro significativo."], ["5. Límites críticos", "Los límites deben ser medibles u observables y separar condiciones aceptables de no aceptables."], ["6. Vigilancia", "La vigilancia comprueba a tiempo si el control se mantiene dentro de los límites."], ["7. Acciones correctoras", "Definen qué hacer con el proceso y el producto cuando se pierde el control."], ["8. Verificación y registros", "La verificación confirma que el sistema funciona y los registros aportan evidencia."]], "questions": [["¿Cuál es el enfoque principal del APPCC?", ["Preventivo", "Solo reactivo", "Exclusivamente comercial"]], ["¿Qué son los prerrequisitos?", ["Condiciones básicas de higiene y operación que sostienen el sistema", "Solo documentos de venta", "Únicamente controles de caja"]], ["¿Qué se evalúa en un análisis de peligros?", ["Peligros potenciales, gravedad y probabilidad", "Solo el precio del producto", "Solo el aspecto del local"]], ["¿Qué es un PCC?", ["Una etapa donde el control es esencial frente a un peligro significativo", "Cualquier mesa de trabajo", "Un registro de compras"]], ["¿Qué es un límite crítico?", ["Criterio que separa aceptabilidad de no aceptabilidad en un PCC", "Un precio máximo", "Un horario de apertura"]], ["¿Para qué sirve la vigilancia?", ["Para detectar a tiempo pérdida de control", "Para sustituir la limpieza", "Para eliminar todos los registros"]], ["¿Qué se hace cuando se supera un límite crítico?", ["Aplicar acciones correctoras definidas", "Ignorar el resultado", "Modificar el registro"]], ["¿Qué aporta la verificación?", ["Evidencia de que el sistema funciona según lo previsto", "Sustituye toda vigilancia", "Elimina la necesidad de procedimientos"]], ["¿Por qué son importantes los registros?", ["Aportan evidencia y permiten seguimiento", "Solo sirven para publicidad", "No tienen utilidad"]], ["¿Puede un peligro ser biológico, químico o físico?", ["Sí", "No", "Solo biológico"]], ["¿Un PCC debe tener un método de vigilancia?", ["Sí", "No", "Solo si hay una inspección"]], ["¿Las acciones correctoras deben contemplar el producto afectado?", ["Sí", "No", "Nunca"]], ["¿La calibración de equipos puede formar parte de la verificación o soporte del control?", ["Sí", "No", "Solo en oficinas"]], ["¿Debe revisarse el APPCC cuando cambia significativamente el proceso?", ["Sí", "No", "Solo cada diez años"]], ["¿El APPCC sustituye las buenas prácticas de higiene?", ["No, se apoya en ellas", "Sí, totalmente", "Solo en verano"]], ["¿Un límite crítico debería poder comprobarse?", ["Sí", "No", "Es mejor que sea ambiguo"]], ["¿Quién debe conocer los controles que ejecuta?", ["El personal responsable de esas tareas", "Solo el proveedor", "Nadie"]], ["¿La recepción de materias primas puede incluir medidas de control?", ["Sí", "No", "Nunca"]], ["¿La documentación debe reflejar lo que realmente se hace?", ["Sí", "No", "Solo una versión teórica"]], ["¿Cuál es una finalidad del APPCC?", ["Prevenir o controlar peligros significativos para la seguridad alimentaria", "Aumentar el tamaño de las raciones", "Eliminar la formación"]]]}, "en": {"title": "Basic HACCP", "subtitle": "8 modules · hazards, control points, monitoring, records and corrective actions", "modules": [["1. What is HACCP", "A preventive system for identifying significant hazards and establishing control measures."], ["2. Prerequisite programmes", "Hygiene, cleaning, water, suppliers, pests and maintenance support the HACCP system."], ["3. Hazard analysis", "Assess what can happen, its severity and likelihood to determine suitable controls."], ["4. Critical control points", "A CCP is a step where control is essential to prevent, eliminate or reduce a significant hazard."], ["5. Critical limits", "Limits should be measurable or observable and distinguish acceptable from unacceptable conditions."], ["6. Monitoring", "Monitoring checks in time whether control remains within established limits."], ["7. Corrective actions", "Define what to do with the process and product when control is lost."], ["8. Verification and records", "Verification confirms the system works and records provide evidence."]], "questions": [["What is HACCP mainly focused on?", ["Prevention", "Reaction only", "Commercial matters only"]], ["What are prerequisite programmes?", ["Basic hygiene and operating conditions supporting the system", "Sales documents only", "Cash-register controls only"]], ["What is assessed in hazard analysis?", ["Potential hazards, severity and likelihood", "Only product price", "Only the appearance of the premises"]], ["What is a CCP?", ["A step where control is essential for a significant hazard", "Any work table", "A purchasing record"]], ["What is a critical limit?", ["A criterion separating acceptable from unacceptable conditions at a CCP", "A maximum price", "Opening hours"]], ["What is monitoring for?", ["Detecting loss of control in time", "Replacing cleaning", "Removing all records"]], ["What happens when a critical limit is exceeded?", ["Defined corrective actions are applied", "The result is ignored", "The record is changed"]], ["What does verification provide?", ["Evidence that the system works as intended", "It replaces all monitoring", "It removes the need for procedures"]], ["Why are records important?", ["They provide evidence and enable follow-up", "They are only for advertising", "They have no use"]], ["Can a hazard be biological, chemical or physical?", ["Yes", "No", "Biological only"]], ["Should a CCP have a monitoring method?", ["Yes", "No", "Only if there is an inspection"]], ["Should corrective actions address affected product?", ["Yes", "No", "Never"]], ["Can equipment calibration support verification or control?", ["Yes", "No", "Only in offices"]], ["Should HACCP be reviewed after a significant process change?", ["Yes", "No", "Only every ten years"]], ["Does HACCP replace good hygiene practices?", ["No, it relies on them", "Yes, completely", "Only in summer"]], ["Should a critical limit be checkable?", ["Yes", "No", "It is better if ambiguous"]], ["Who should know the controls they perform?", ["The staff responsible for those tasks", "Only the supplier", "Nobody"]], ["Can receiving raw materials include control measures?", ["Yes", "No", "Never"]], ["Should documentation reflect what is actually done?", ["Yes", "No", "Only a theoretical version"]], ["What is one purpose of HACCP?", ["Prevent or control significant food-safety hazards", "Increase portion size", "Eliminate training"]]]}, "ru": {"title": "Основы HACCP", "subtitle": "8 модулей · опасности, контрольные точки, мониторинг, записи и корректирующие действия", "modules": [["1. Что такое HACCP", "Профилактическая система для выявления значимых опасностей и установления мер контроля."], ["2. Предварительные программы", "Гигиена, уборка, вода, поставщики, борьба с вредителями и техническое обслуживание поддерживают систему HACCP."], ["3. Анализ опасностей", "Оценивают возможное событие, его тяжесть и вероятность, чтобы выбрать подходящий контроль."], ["4. Критические контрольные точки", "ККТ — этап, где контроль необходим для предотвращения, устранения или снижения значимой опасности."], ["5. Критические пределы", "Пределы должны быть измеримыми или наблюдаемыми и отделять приемлемые условия от неприемлемых."], ["6. Мониторинг", "Мониторинг своевременно показывает, остаётся ли процесс в установленных пределах."], ["7. Корректирующие действия", "Определяют, что делать с процессом и продуктом при потере контроля."], ["8. Проверка и записи", "Проверка подтверждает эффективность системы, а записи служат доказательством."]], "questions": [["Какова основная направленность HACCP?", ["Профилактика", "Только реакция после события", "Только коммерческие вопросы"]], ["Что такое предварительные программы?", ["Базовые санитарные и операционные условия, поддерживающие систему", "Только документы продаж", "Только контроль кассы"]], ["Что оценивают при анализе опасностей?", ["Потенциальные опасности, тяжесть и вероятность", "Только цену", "Только внешний вид помещения"]], ["Что такое ККТ?", ["Этап, где контроль необходим для значимой опасности", "Любой рабочий стол", "Запись о закупке"]], ["Что такое критический предел?", ["Критерий, отделяющий приемлемое состояние от неприемлемого в ККТ", "Максимальная цена", "Время открытия"]], ["Для чего нужен мониторинг?", ["Чтобы вовремя обнаружить потерю контроля", "Чтобы заменить уборку", "Чтобы удалить все записи"]], ["Что делать при превышении критического предела?", ["Применить установленные корректирующие действия", "Игнорировать результат", "Изменить запись"]], ["Что даёт верификация?", ["Подтверждение, что система работает как задумано", "Заменяет весь мониторинг", "Отменяет процедуры"]], ["Почему важны записи?", ["Они дают доказательства и позволяют отслеживание", "Только для рекламы", "Они бесполезны"]], ["Может ли опасность быть биологической, химической или физической?", ["Да", "Нет", "Только биологической"]], ["Должен ли у К , "subtitle": "6 módulos · planes, productos, frecuencias, verificación, residuos y plagas", "modules": [["1. Plan de limpieza", "Define qué se limpia, cómo, con qué producto, cuándo y quién es responsable."], ["2. Limpieza antes de desinfectar", "La suciedad puede reducir la eficacia del desinfectante; normalmente primero se limpia y luego se desinfecta."], ["3. Productos químicos", "Hay que respetar etiqueta, concentración, tiempo de contacto, compatibilidades y medidas de seguridad."], ["4. Utensilios y zonas", "Separar útiles por zonas y mantenerlos limpios reduce contaminación cruzada."], ["5. Verificación", "Inspección, registros y métodos de comprobación permiten confirmar que el plan funciona."], ["6. Residuos y plagas", "Gestionar residuos, cierres, accesos y señales de plagas forma parte de la higiene del establecimiento."]], "questions": [["¿Qué debe indicar un plan de limpieza?", ["Qué, cómo, con qué, cuándo y quién", "Solo quién", "Solo el nombre del producto"]], ["¿Por qué suele limpiarse antes de desinfectar?", ["Porque la suciedad puede reducir la eficacia del desinfectante", "Porque la desinfección ensucia", "Porque nunca se usan detergentes"]], ["¿Qué debe respetarse al usar un químico?", ["Etiqueta, dosis, tiempo de contacto y seguridad", "Solo el olor", "La mayor concentración posible"]], ["¿Es correcto mezclar productos químicos sin comprobar compatibilidad?", ["No", "Sí, siempre", "Solo si tienen colores distintos"]], ["¿Qué reduce contaminación cruzada en limpieza?", ["Separar utensilios por zonas cuando sea necesario", "Usar el mismo paño en todo", "Guardar utensilios húmedos y sucios"]], ["¿Para qué sirven los registros de limpieza?", ["Para evidenciar ejecución y facilitar seguimiento", "Para sustituir la limpieza", "Solo para decorar"]], ["¿Qué es verificar un plan de limpieza?", ["Comprobar que se ejecuta y consigue el resultado esperado", "Cambiarlo todos los días sin motivo", "No revisar nunca"]], ["¿Debe limpiarse el equipo según instrucciones compatibles con su uso?", ["Sí", "No", "Solo si es nuevo"]], ["¿Los residuos pueden favorecer plagas?", ["Sí", "No", "Nunca"]], ["¿Qué debe hacerse con productos de limpieza?", ["Almacenarlos de forma segura y separados de alimentos según proceda", "Guardarlos dentro de envases de comida", "Dejarlos sin identificar"]], ["¿Es importante el tiempo de contacto de un desinfectante?", ["Sí", "No", "Solo el color importa"]], ["¿Qué debe hacerse antes de aplicar un producto nuevo?", ["Leer y seguir sus instrucciones de uso y seguridad", "Mezclarlo con el anterior", "Usarlo sin identificar"]], ["¿Los paños y útiles sucios pueden ser fuente de contaminación?", ["Sí", "No", "Solo si son de color oscuro"]], ["¿La frecuencia de limpieza depende del riesgo y uso de la zona?", ["Sí", "No", "Siempre debe ser idéntica"]], ["¿Qué medida ayuda frente a plagas?", ["Eliminar refugios, alimentos accesibles y puntos de entrada", "Acumular residuos", "Dejar puertas abiertas"]], ["¿Debe actuarse ante signos de plagas?", ["Sí, según el procedimiento establecido", "No", "Solo si lo pide un cliente"]], ["¿La limpieza incluye equipos y superficies que contactan con alimentos?", ["Sí", "No", "Solo el suelo"]], ["¿Qué diferencia básica hay entre limpiar y desinfectar?", ["Limpiar elimina suciedad; desinfectar reduce microorganismos", "Son exactamente lo mismo", "Desinfectar solo seca"]], ["¿Debe controlarse la dosificación de químicos?", ["Sí", "No", "Cuanto más, siempre mejor"]], ["¿Cuál es el objetivo final del plan?", ["Mantener condiciones higiénicas y reducir riesgos", "Generar más residuos", "Evitar cualquier comprobación"]]]}, "en": {"title": "Food Cleaning & Disinfection", "subtitle": "6 modules · plans, products, frequencies, verification, waste and pests", "modules": [["1. Cleaning plan", "Define what is cleaned, how, with which product, when and who is responsible."], ["2. Clean before disinfecting", "Dirt can reduce disinfectant effectiveness; normally clean first and disinfect afterwards."], ["3. Chemicals", "Follow the label, concentration, contact time, compatibility and safety measures."], ["4. Tools and zones", "Separating cleaning tools by area and keeping them clean reduces cross-contamination."], ["5. Verification", "Inspection, records and verification methods confirm whether the plan works."], ["6. Waste and pests", "Managing waste, closures, access points and pest signs is part of establishment hygiene."]], "questions": [["What should a cleaning plan state?", ["What, how, with what, when and who", "Only who", "Only the product name"]], ["Why is cleaning usually done before disinfection?", ["Dirt can reduce disinfectant effectiveness", "Disinfection creates dirt", "Detergents are never used"]], ["What should be followed when using a chemical?", ["Label, dose, contact time and safety", "Only smell", "The highest possible concentration"]], ["Is it correct to mix chemicals without checking compatibility?", ["No", "Yes, always", "Only if colours differ"]], ["What reduces cross-contamination during cleaning?", ["Separating tools by area when needed", "Using the same cloth everywhere", "Storing tools wet and dirty"]], ["What are cleaning records for?", ["Evidence of completion and follow-up", "Replacing cleaning", "Decoration only"]], ["What does verifying a cleaning plan mean?", ["Checking it is carried out and achieves the expected result", "Changing it every day without reason", "Never reviewing it"]], ["Should equipment be cleaned according to suitable instructions?", ["Yes", "No", "Only when new"]], ["Can waste encourage pests?", ["Yes", "No", "Never"]], ["How should cleaning products be stored?", ["Safely and separated from food as appropriate", "Inside food containers", "Unlabelled"]], ["Is disinfectant contact time important?", ["Yes", "No", "Only colour matters"]], ["What before using a new product?", ["Read and follow use and safety instructions", "Mix it with the previous one", "Use it unidentified"]], ["Can dirty cloths
